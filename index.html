<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Open+Sans:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React & Babel CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
      body {
        font-family: "Open Sans", sans-serif;
      }
      h1,
      h2,
      h3,
      h4,
      .font-montserrat {
        font-family: "Montserrat", sans-serif;
      }
      html {
        scroll-behavior: smooth;
      }
    </style>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              darkGreen: "#3E764E",
              lightGreen: "#A3D9A2",
              cream: "#F5EFE3",
              grey: "#695A5A",
            },
          },
        },
      };
    </script>
  </head>
  <body class="bg-[#F5EFE3] text-[#695A5A]">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect } = React;

      // Componente Helper per le Icone Lucide
      const Icon = ({ name, size = 24, className = "" }) => {
        useEffect(() => {
          lucide.createIcons();
        }, [name]);
        return (
          <i
            data-lucide={name}
            className={className}
            style={{ width: size, height: size }}
          ></i>
        );
      };

      const App = () => {
        const [isMenuOpen, setIsMenuOpen] = useState(false);
        const [scrolled, setScrolled] = useState(false);

        useEffect(() => {
          const handleScroll = () => setScrolled(window.scrollY > 50);
          window.addEventListener("scroll", handleScroll);
          lucide.createIcons();
          return () => window.removeEventListener("scroll", handleScroll);
        }, []);

        const services = [
          {
            title: "Manutenzione Giardini",
            desc: "Taglio erba, potature specializzate e pulizie stagionali per un verde sempre in ordine.",
            icon: "scissors",
          },
          {
            title: "Cura Professionale",
            desc: "Trattamenti specifici per ogni tipo di pianta e spazio esterno, dal terrazzo al grande parco.",
            icon: "leaf",
          },
          {
            title: "Automazione & AI",
            desc: "Sistemi intelligenti per la gestione del giardino e preventivi rapidi tramite chatbot.",
            icon: "sparkles",
          },
        ];

        const values = [
          "Pulizia e ordine",
          "Affidabilità artigianale",
          "Rispetto per il territorio",
          "Soluzioni su misura",
        ];

        return (

              className={`fixed w-full z-50 transition-all duration-300 ${scrolled ? "bg-white shadow-md py-2" : "bg-transparent py-4"}`}

                <div className="flex items-center gap-2">
                  <div className="bg-[#3E764E] p-1.5 rounded-lg">
                    <Icon name="leaf" className="text-white" size={24} />
                  </div>
                  <span className="font-bold text-xl tracking-tighter text-[#3E764E]">
                    GIARDINIPULITI
                  </span>
                </div>

                {/* Desktop Menu */}

                  <a
                    href="#servizi"
                    className="hover:opacity-70 transition-opacity"
                  >
                    Servizi
                  </a>
                  <a
                    href="#missione"
                    className="hover:opacity-70 transition-opacity"
                  >
                    Chi Siamo
                  </a>
                  <a
                    href="#lavori"
                    className="hover:opacity-70 transition-opacity"
                  >
                    I Nostri Lavori

                <button

                  </div>
                </div>
              </div>

                  <div className="w-20 h-1.5 mx-auto rounded-full bg-[#A3D9A2]"></div>

                    <div className="grid sm:grid-cols-2 gap-4">
                      {values.map((v, i) => (

                        >
                          <span className="font-bold">{v}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            </section>

                    />

                <div className="grid md:grid-cols-2 gap-10">
                  <div className="bg-gray-50 rounded-3xl overflow-hidden shadow-lg border border-gray-100 group">
                    <div className="flex flex-col sm:flex-row h-64">
                      <div className="relative flex-1 group-hover:scale-[1.02] transition-transform">

                          className="w-full h-full object-cover"

                        <span className="absolute top-4 left-4 bg-black/50 text-white px-3 py-1 rounded-full text-xs backdrop-blur-md">
                          Prima
                        </span>
                      </div>
                      <div className="relative flex-1 group-hover:scale-[1.02] transition-transform">
                        <img
                          src="https://images.unsplash.com/photo-1584479898061-15742e14f50d?auto=format&fit=crop&w=600&q=80"
                          className="w-full h-full object-cover"
                          alt="Dopo"

                        <span className="absolute top-4 left-4 bg-green-600/70 text-white px-3 py-1 rounded-full text-xs backdrop-blur-md">

                      <h4 className="font-bold text-xl mb-1 text-[#3E764E]">

                        <span className="absolute top-4 left-4 bg-black/50 text-white px-3 py-1 rounded-full text-xs backdrop-blur-md">

                      <div className="relative flex-1 group-hover:scale-[1.02] transition-transform">
                        <img
                          src="https://images.unsplash.com/photo-1591857177580-dc82b9ac4e1e?auto=format&fit=crop&w=600&q=80"
                          className="w-full h-full object-cover"
                          alt="Dopo"
                        />
                        <span className="absolute top-4 left-4 bg-green-600/70 text-white px-3 py-1 rounded-full text-xs backdrop-blur-md">
                          Dopo
                        </span>
                      </div>
                    </div>
                    <div className="p-6">
                      <h4 className="font-bold text-xl mb-1 text-[#3E764E]">
                        Manutenzione Autunnale
                      </h4>
                      <p className="text-sm opacity-70">
                        Sistemazione siepi - Locarno
                      </p>
                    </div>
                  </div>
                </div>
              </div>
            </section>

            {/* CTA Section */}
            <section className="py-20">
              <div className="container mx-auto px-6">
                <div className="bg-[#3E764E] rounded-[40px] p-10 md:p-20 text-white text-center relative overflow-hidden">
                  <div className="relative z-10">
                    <h2 className="font-bold text-4xl md:text-5xl mb-6 italic">
                      Pronto a trasformare il tuo giardino?
                    </h2>
                    <p className="text-xl mb-10 opacity-90 max-w-2xl mx-auto">

                      preventivo immediato tramite il nostro sistema

                    </p>
                    <div className="flex flex-wrap justify-center gap-6">
                      <button className="bg-white px-10 py-4 rounded-full font-bold text-lg flex items-center gap-2 text-[#3E764E] hover:scale-105 transition-transform">
                        <Icon name="message-circle" /> WhatsApp Business
                      </button>
                      <button className="bg-transparent border-2 border-white px-10 py-4 rounded-full font-bold text-lg hover:bg-white/10 transition-colors">

                      </button>
                    </div>
                  </div>
                  <div className="absolute -top-20 -right-20 w-80 h-80 rounded-full blur-3xl opacity-20 bg-white"></div>

                      </li>
                      <li className="flex items-center gap-3">

                      </li>
                    </ul>
                  </div>

                  <div>
                    <h5 className="font-bold mb-6 text-[#3E764E]">

                    </h5>
                    <ul className="flex flex-col gap-4 opacity-70">
                      <li>
                        <a href="#" className="hover:underline">

                      </li>
                      <li>
                        <a href="#servizi" className="hover:underline">
                          Servizi

  </body>
</html>
